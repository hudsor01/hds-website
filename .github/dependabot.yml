version: 2
updates:
  # Enable version updates for npm (Bun compatible)
  # bun, not npm. This repo's lockfile is bun.lock, and CI installs with
  # `bun install --frozen-lockfile`. The npm updater edits package.json but
  # cannot write bun.lock, so every PR it opened failed at install with
  # "lockfile had changes, but lockfile is frozen".
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    groups:
      # Group all dev dependencies together
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      # Group production dependencies
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "patch"
    labels:
      - "dependencies"
      - "automated"

  # GitHub Actions updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "github-actions"
      - "automated"