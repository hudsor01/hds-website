name: Publish scheduled posts

# Blog posts with a future publishedAt are held out of the build
# (scripts/blog/build.ts). This rebuilds production once their date arrives,
# and only when a dated post is actually missing from the live site.
on:
  schedule:
    # 11:00 UTC is 5-6am Central, so a post dated today is up by morning.
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish due posts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Find due posts missing from the live site
        id: pending
        run: |
          pending=$(bun run scripts/blog/pending.ts https://hudsondigitalsolutions.com)
          echo "$pending"
          echo "count=$(printf '%s' "$pending" | grep -c . || true)" >> "$GITHUB_OUTPUT"

      - name: Trigger production build
        if: steps.pending.outputs.count != '0'
        env:
          DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "::error::VERCEL_DEPLOY_HOOK_URL secret is not set"
            exit 1
          fi
          curl -fsS -X POST "$DEPLOY_HOOK_URL" > /dev/null
          echo "Production rebuild triggered"
